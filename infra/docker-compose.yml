# infra/docker-compose.yml

services:
  #--------------------------------------------------------------------------
  # PostgreSQL Database Service
  #--------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: owg-postgres
    restart: on-failure
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=owg_core_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d owg_core_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - owg-network

  #--------------------------------------------------------------------------
  # Flyway Database Migration Service - Core
  #--------------------------------------------------------------------------
  flyway-core:
    image: flyway/flyway:latest
    container_name: owg-flyway-core
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/core/migrations:/flyway/sql
    command:
      - -url=jdbc:postgresql://postgres:5432/owg_core_db
      - -user=test
      - -password=test
      - -connectRetries=60
      - migrate
    networks:
      - owg-network

  #--------------------------------------------------------------------------
  # API Service (NestJS)
  #--------------------------------------------------------------------------
  api:
    container_name: owg-api
    build:
      context: ../apps/api
      dockerfile: Dockerfile.dev
    working_dir: /usr/src/app
    volumes:
      - ../apps/api:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://test:test@postgres:5432/owg_core_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      flyway-core:
        condition: service_completed_successfully
    networks:
      - owg-network

#------------------------------------------------------------------------------
# Volumes
#------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: owg-postgres-data

#------------------------------------------------------------------------------
# Networks
#------------------------------------------------------------------------------
networks:
  owg-network:
    driver: bridge